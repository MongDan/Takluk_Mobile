name: takluk
description: "Takluk (RuangKuliah Hub) - Platform EdTech Mahasiswa"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Networking
  dio: ^5.7.0

  # UI & Design
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0

  # Video Player
  video_player: ^2.9.2
  chewie: ^1.8.5

  # QR Code
  qr_flutter: ^4.1.0

  # Markdown & Math
  flutter_markdown: ^0.7.4+3
  flutter_math_fork: ^0.7.2

  # Device Info
  device_info_plus: ^11.2.0

  # Storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.3

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  confetti: ^0.7.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
